services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: safespec-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DATABASE_URL=sqlite:////app/backend/safespec.db
    volumes:
      - ./backend/documents:/app/backend/documents
      - ./backend/safespec.db:/app/backend/safespec.db
      - ./backend/app/ecu/versions:/app/backend/app/ecu/versions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: safespec-frontend
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: safespec-network
